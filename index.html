<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>Studio Rangka - Rancang Furnitur Rangka Besi</title>
    <meta name="description" content="Rancang meja, rak, troli dan meja dapur rangka besi hollow dengan 3D interaktif, daftar potongan besi, dan perkiraan biaya bahan." />
    <meta property="og:title" content="Studio Rangka - Rancang Furnitur Rangka Besi" />
    <meta property="og:description" content="Rancang meja, rak, troli dan meja dapur rangka besi hollow dengan 3D interaktif, daftar potongan besi, dan perkiraan biaya bahan." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Pasang tema sebelum aplikasi dimuat supaya tidak berkedip putih (lihat src/theme.ts)
      (function () {
        try {
          var p = localStorage.getItem('studiorangka_theme');
          var d = p === 'dark' || (p !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (d) { document.documentElement.classList.add('dark'); document.documentElement.style.colorScheme = 'dark'; }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
